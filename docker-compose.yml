services:
  db:
    image: postgres:18-alpine
    container_name: petshop-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: petshop
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
